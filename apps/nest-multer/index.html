<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/axios@0.24.0/dist/axios.min.js"></script>
  </head>
  <body>
    <p>单个文件上传</p>
    <input type="file" id="fileInput" />
    <hr />
    <p>多个文件上传</p>
    <input type="file" id="fileInput2" multiple />
    <hr />
    <p>单个文件上传，文件大小验证</p>
    <input type="file" id="fileInput3" />
    <hr />
    <p>nest封装好的内置验证</p>
    <input type="file" id="fileInput4" />
    <hr />
    <p>自定义文件验证器</p>
    <input type="file" id="fileInput5" />
    <hr />
    <script>
      const fileInput = document.getElementById("fileInput");
      const fileInput2 = document.getElementById("fileInput2");
      const fileInput3 = document.getElementById("fileInput3");
      const fileInput4 = document.getElementById("fileInput4");
      const fileInput5 = document.getElementById("fileInput5");

      fileInput.onchange = async () => {
        const data = new FormData();
        data.set("name", "chen");
        data.set("age", 18);
        data.set("aaa", fileInput.files[0]);
        const res = await axios.post("http://localhost:3000/aaa", data);
        console.log(res);
      };
      fileInput2.onchange = async () => {
        const data = new FormData();
        data.set("name", "chen");
        data.set("age", 18);
        [...fileInput2.files].forEach((file) => {
          data.append("bbb", file);
        });
        const res = await axios.post("http://localhost:3000/bbb", data);
        console.log(res);
      };

      fileInput3.onchange = async () => {
        const data = new FormData();
        data.set("name", "chen");
        data.set("age", 18);
        data.set("ccc", fileInput3.files[0]);
        const res = await axios.post("http://localhost:3000/ccc", data);
        console.log(res);
      };

      fileInput4.onchange = async () => {
        const data = new FormData();
        data.set("name", "chen");
        data.set("age", 18);
        data.set("ddd", fileInput4.files[0]);
        const res = await axios.post("http://localhost:3000/ddd", data);
        console.log(res);
      };

      fileInput5.onchange = async () => {
        const data = new FormData();
        data.set("name", "chen");
        data.set("age", 18);
        data.set("eee", fileInput5.files[0]);
        const res = await axios.post("http://localhost:3000/eee", data);
        console.log(res);
      };
    </script>
  </body>
</html>
